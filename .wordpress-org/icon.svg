<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4112a"/>
      <stop offset="1" stop-color="#c20f23"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f1f1"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- parcel box (white / light grey for 3D shading) -->
  <g transform="translate(128 138)">
    <path d="M0 0 L-62 -34 L-62 40 L0 74 Z" fill="#e9e9e9"/>
    <path d="M0 0 L62 -34 L62 40 L0 74 Z" fill="#d6d6d6"/>
    <path d="M0 0 L-62 -34 L0 -68 L62 -34 Z" fill="url(#box)"/>
    <path d="M0 0 L0 74" stroke="#c4c4c4" stroke-width="6" opacity=".8"/>
    <path d="M-62 -34 L0 0 L62 -34" fill="none" stroke="#c4c4c4" stroke-width="5" opacity=".6"/>
  </g>

  <!-- white location pin -->
  <g transform="translate(186 66)">
    <path d="M0 -26 a26 26 0 0 1 26 26 c0 19 -26 44 -26 44 c0 0 -26 -25 -26 -44 a26 26 0 0 1 26 -26 z" fill="#ffffff" stroke="#9e0c1a" stroke-width="3"/>
    <circle cx="0" cy="0" r="9" fill="#dc1928"/>
  </g>
</svg>
